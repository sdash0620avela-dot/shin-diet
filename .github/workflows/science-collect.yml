name: Sports science collection

on:
  schedule:
    - cron: "17 21 1 * *" # 毎月2日 06:17 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Collect new systematic reviews from PubMed
        run: node scripts/collect-science.mjs --days 45 --issue-body issue.md
      - name: Open verification issue
        if: hashFiles('issue.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "$GITHUB_REPOSITORY" --title "スポーツ科学 新規候補（原典検証待ち）$(date +%Y-%m)" --body-file issue.md
      - uses: actions/upload-artifact@v4
        with:
          name: science-candidates
          path: science/candidates.json
